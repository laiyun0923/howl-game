<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>霍爾的移動城堡：蘇菲的選擇（天氣料理版）</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--wood:#7a4a22;--gold:#e8a83a;--paper:#f3dca6;--ink:#4a2a12;--bg:#241610;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);font-family:'DotGothic16','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;display:flex;justify-content:center}
.game{width:min(760px,100%);padding:14px;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:#d9c08a}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit}
.hud button{background:var(--wood);color:var(--paper);border:2px solid var(--gold);padding:3px 9px;cursor:pointer}
.frame{border:5px solid var(--wood);outline:3px solid var(--gold);background:#000;position:relative;aspect-ratio:16/9;overflow:hidden}
.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.frame::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);pointer-events:none}
.cap,.toast{position:absolute;left:8px;background:var(--paper);color:var(--ink);border:3px solid var(--wood);padding:3px 10px;font-size:15px;z-index:2}
.cap{top:8px}.toast{bottom:8px;z-index:3}
.mg{position:absolute;inset:0;z-index:4;background:rgba(36,22,16,.94);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;font-size:16px}
.mg p{margin:0}.bar2{position:relative;height:22px;width:80%;background:#5a3a22;border:2px solid var(--gold)}
.bar2 i{position:absolute;left:38%;width:24%;height:100%;background:#6ab04c}.bar2 b{position:absolute;width:6px;height:100%;background:#f6c34a;left:0}
.dust{position:relative;width:90%;height:55%}.dust button{position:absolute;background:none;border:0;color:#f3dca6;font-size:26px;cursor:pointer}
.box{border:5px solid var(--gold);outline:3px solid var(--wood);background:var(--paper);color:var(--ink);padding:14px 16px 26px;min-height:140px;cursor:pointer;position:relative}
.who{display:inline-block;background:var(--wood);color:var(--paper);padding:2px 10px;margin-bottom:8px;font-size:15px}
.txt{font-size:18px;line-height:1.75;margin:0;white-space:pre-wrap}
.ep{font-size:15px;line-height:1.7;margin:8px 0 0;color:#6a4a2a;white-space:pre-wrap}
.nx{position:absolute;right:12px;bottom:6px;color:#b5481c;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{font-size:17px;text-align:left;color:var(--paper);background:var(--wood);border:3px solid #4a2a12;padding:10px 12px;cursor:pointer}
.opt:hover,.opt:focus-visible{border-color:#b5481c;background:#955c2c;outline:none}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(10,6,4,.8);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden],[hidden]{display:none!important}
.mc{background:var(--paper);color:var(--ink);border:5px solid var(--gold);outline:3px solid var(--wood);max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:16px;position:relative;font-size:15px;line-height:1.7}
.mc h3{margin:0 0 8px}.mc .x{position:sticky;float:right;top:0;background:var(--wood);color:var(--paper);border:2px solid var(--gold);cursor:pointer}
.mc label{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0}
.mc .it{border-top:2px dashed #b99a62;padding:6px 0}.mc .lk{opacity:.55}
.mc img{width:100%;image-rendering:pixelated;border:3px solid var(--wood)}
.row{display:flex;gap:12px;align-items:flex-start}.col{flex:1;min-width:0}.pt{width:72px;height:72px;flex:none;image-rendering:pixelated;border:3px solid var(--wood);background:#d9bb7e}.ab{display:inline-block;width:60px;height:8px;border:2px solid var(--gold);vertical-align:middle;margin-left:4px}.ab i{display:block;height:100%;background:#e8a83a}.it{white-space:pre-wrap}.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.gal img{cursor:pointer}.gal .lk{aspect-ratio:16/9;background:#c9a96a;display:flex;align-items:center;justify-content:center;font-size:22px}.mc .opt{width:100%;margin:4px 0}
@media(max-width:520px){.pt{width:56px;height:56px}.opt{min-height:50px;font-size:18px}.hud button{padding:7px 10px}.txt{font-size:17px}}
@media(prefers-reduced-motion:reduce){.nx{animation:none}}
</style></head><body>
<main class="game">
 <div class="hud"><span id="hud"></span><span id="wxi"></span><span id="agw"><span id="agt"></span><span class="ab"><i id="agi"></i></span></span>
  <span class="bar"><span id="seen"></span><span id="shc"></span>
  <button id="bk" title="回到上一個重要選擇">↩ 回溯</button><button id="bwx" title="查看天氣預報與角色羈絆">旅途日誌</button><button id="blog">記錄</button><button id="bmenu">選單</button><button id="mu">♪ 開</button></span></div>
 <div class="frame" id="fr"><canvas id="cv" width="160" height="90"></canvas><div class="cap" id="cap" hidden></div><div class="toast" id="toast" hidden></div><div class="mg" id="mg" hidden></div></div>
 <div class="box" id="box" tabindex="0">
  <div class="row"><canvas id="pt" class="pt" width="24" height="24"></canvas><div class="col"><span class="who" id="who"></span><p class="txt" id="txt"></p></div></div><p class="ep" id="ep" hidden></p>
  <div class="opts" id="opts"></div>
  <span class="nx" id="nx">▼</span>
 </div>
</main>
<div class="modal" id="modal" hidden><div class="mc"><button class="x" id="mx">✕ 關閉</button><div id="mb"></div></div></div>
